services:
  - type: web
    name: afyalink-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app run db upgrade && python seed.py --if-empty && gunicorn run:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: afyalink-db
          property: connectionString

databases:
  - name: afyalink-db
